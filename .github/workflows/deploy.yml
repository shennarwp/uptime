name: Trigger auto deployment for uptime

permissions: {}

on:
  push:
    branches:
      - 'main'
      - 'fix/deploy' # TODO DELETE
    tags:
      - '**'

  # Allow manual trigger
  workflow_dispatch:

jobs:
  sonarqube:
    name: Scan code with sonarqube
    runs-on: ubuntu-latest
    steps:
      - name: Checkout to the branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout to the branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.26.5'

      - name: Run Go Tests
        run: go test -v ./... -coverprofile=coverage.txt

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.18.1

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: ./web

      - name: Run tests
        run: npm run test:coverage
        working-directory: ./web

  build-and-push:
    name: Build image and push to registries
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      packages: write # to publish to ghcr
      id-token: write
      contents: read
      attestations: write
      security-events: write # required to upload SARIF files to Security tab
    outputs:
      tag: ${{ steps.check-tag.outputs.TAG }}
      is_tag_deploy: ${{ steps.check-tag.outputs.IS_TAG_DEPLOY }}

    steps:
      - name: Collect workflow telemetry
        uses: Alaffia-Technology-Solutions/workflow-telemetry-action@bdadd22e6300d543bae275ed7380969384893c73 # v3.0.0

      - name: Checkout to the branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check tag and set outputs
        id: check-tag
        run: |
          IS_TAG_DEPLOY='false'
          TAG_NAME=""
          if [[ "${{ github.ref_type }}" == 'tag' ]]; then
              TAG_NAME="${GITHUB_REF#refs/*/}"
              echo "TAG=$TAG_NAME" >> "$GITHUB_OUTPUT"
              # Check if tag matches YYYY.MM.DD-freetext format
              if [[ "$TAG_NAME" =~ ^[0-9]{4}\.[0-9]{2}\.[0-9]{2}(-[^\s]+)?$ ]]; then
                  IS_TAG_DEPLOY='true'
              fi
          else
              echo "TAG=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi
          echo "IS_TAG_DEPLOY=$IS_TAG_DEPLOY" >> "$GITHUB_OUTPUT"

      - name: Login to ghcr
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to dockerhub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

#      - name: Build and push busybox image
#        id: build-push-busybox
#        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
#        with:
#          platforms: linux/amd64,linux/arm64
#          file: Dockerfile-alpine-busybox
#          push: true
#          sbom: true
#          tags: |
#            ghcr.io/${{ secrets.GHCR_USERNAME }}/resume:busybox-${{ steps.check-tag.outputs.TAG }}
#            ghcr.io/${{ secrets.GHCR_USERNAME }}/resume:busybox-latest
#            ${{ secrets.DOCKERHUB_USERNAME }}/resume:busybox-${{ steps.check-tag.outputs.TAG }}
#            ${{ secrets.DOCKERHUB_USERNAME }}/resume:busybox-latest

      - name: Build and push alpine image
        id: build-push-alpine
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          platforms: linux/amd64,linux/arm64
          file: Dockerfile-alpine
          push: true
          sbom: true
          tags: |
            ghcr.io/${{ secrets.GHCR_USERNAME }}/resume:alpine-${{ steps.check-tag.outputs.TAG }}
            ghcr.io/${{ secrets.GHCR_USERNAME }}/resume:alpine-latest
            ${{ secrets.DOCKERHUB_USERNAME }}/resume:alpine-${{ steps.check-tag.outputs.TAG }}
            ${{ secrets.DOCKERHUB_USERNAME }}/resume:alpine-latest

#      - name: Attest dockerhub image
#        if: github.event_name == 'push' && (github.ref_type == 'branch' || steps.check-tag.outputs.IS_TAG_DEPLOY == 'true')
#        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
#        with:
#          subject-name: ${{ secrets.DOCKERHUB_USERNAME }}/resume
#          subject-digest: ${{ steps.build-push-busybox.outputs.digest }}

      - name: Attest ghcr image
        if: github.event_name == 'push' && (github.ref_type == 'branch' || steps.check-tag.outputs.IS_TAG_DEPLOY == 'true')
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4
        with:
          subject-name: ghcr.io/${{ secrets.GHCR_USERNAME }}/resume
          subject-digest: ${{ steps.build-push-alpine.outputs.digest }}
          push-to-registry: true

      - name: Run Trivy vulnerability scanner for alpine image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 #v0.36.0
        with:
          image-ref: 'ghcr.io/${{ secrets.GHCR_USERNAME }}/resume:alpine-${{ steps.check-tag.outputs.TAG }}'
          format: 'template'
          template: '@/contrib/sarif.tpl'
          output: 'alpine-trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy scan results to GitHub Security tab for nginx image
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          sarif_file: 'alpine-trivy-results.sarif'
          category: 'alpine-trivy-image'
#
#      - name: Run Trivy vulnerability scanner for busybox image
#        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 #v0.36.0
#        with:
#          image-ref: 'ghcr.io/${{ secrets.GHCR_USERNAME }}/resume:busybox-${{ steps.check-tag.outputs.TAG }}'
#          format: 'template'
#          template: '@/contrib/sarif.tpl'
#          output: 'busybox-trivy-results.sarif'
#          severity: 'CRITICAL,HIGH'
#
#      - name: Upload Trivy scan results to GitHub Security tab for busybox image
#        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
#        with:
#          sarif_file: 'busybox-trivy-results.sarif'
#          category: 'busybox-trivy-image'

      - name: Run Trivy vulnerability scanner in repo mode
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'sarif'
          output: 'fs-trivy-results.sarif'
          severity: 'CRITICAL'

      - name: Upload Trivy scan results to GitHub Security tab for filesystem
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          sarif_file: 'fs-trivy-results.sarif'
          category: 'trivy-fs'

      - name: Run Trivy in GitHub SBOM mode and submit results to Dependency Graph
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: 'fs'
          format: 'github'
          output: 'dependency-results.sbom.json'
          scan-ref: '.'
          github-pat: ${{ secrets.WORKFLOW_TOKEN }}


