pre-commit:
  parallel: true
  commands:
    go-vet:
      glob: "*.go"
      run: go vet ./...
    tsc:
      root: "web/"
      glob: "*.{ts,tsx}"
      run: npx tsc --noEmit
    eslint:
      root: "web/"
      glob: "*.{ts,tsx,js,jsx}"
      run: npx eslint --cache --fix {staged_files}
    prettier:
      root: "web/"
      run: npx prettier --ignore-unknown --write '{staged_files}'
      stage_fixed: true
