pre-commit:
  parallel: true
  commands:
    go-vet:
      glob: "*.go"
      run: go vet ./...
    tsc:
      root: "web/"
      glob: "*.{ts,tsx}"
      run: npx tsc --noEmit
    eslint:
      root: "web/"
      glob: "*.{ts,tsx,js,jsx}"
      run: npx eslint --cache --fix {staged_files}
