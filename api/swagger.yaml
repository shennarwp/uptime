basePath: /
definitions:
  database.Check:
    properties:
      checked_at:
        description: CheckedAt is when the check was performed.
        type: string
      error_message:
        description: ErrorMessage contains the error message when the check failed,
          if any.
        type: string
      id:
        description: ID is the unique identifier of the check.
        type: integer
      is_up:
        description: IsUp indicates whether the target was reachable.
        type: boolean
      response_time_ms:
        description: ResponseTimeMS is the response time in milliseconds, if any.
        type: integer
      status_code:
        description: StatusCode is the HTTP status code returned by the endpoint,
          if any.
        type: integer
      target_id:
        description: TargetID references the target this check belongs to.
        type: integer
    type: object
  database.Target:
    properties:
      cert_expires_at:
        description: |-
          CertExpiresAt is the NotAfter time of the TLS certificate most recently
          observed for the target, in RFC3339 (UTC). Nil for HTTP targets or before
          the first check observes a certificate.
        type: string
      created_at:
        description: CreatedAt is when the target was created.
        type: string
      id:
        description: ID is the unique identifier of the target.
        type: integer
      name:
        description: Name is a human-readable label for the target.
        type: string
      schedule:
        description: Schedule is the cron expression used for polling.
        type: string
      updated_at:
        description: UpdatedAt is when the target was last updated.
        type: string
      url:
        description: URL is the endpoint that is being monitored.
        type: string
    type: object
  database.TargetWithChecks:
    properties:
      cert_expires_at:
        description: |-
          CertExpiresAt is the NotAfter time of the TLS certificate most recently
          observed for the target, in RFC3339 (UTC). Nil for HTTP targets or before
          the first check observes a certificate.
        type: string
      checks:
        description: Checks contains the recent health check results for the target.
        items:
          $ref: '#/definitions/database.Check'
        type: array
      created_at:
        description: CreatedAt is when the target was created.
        type: string
      id:
        description: ID is the unique identifier of the target.
        type: integer
      name:
        description: Name is a human-readable label for the target.
        type: string
      schedule:
        description: Schedule is the cron expression used for polling.
        type: string
      updated_at:
        description: UpdatedAt is when the target was last updated.
        type: string
      url:
        description: URL is the endpoint that is being monitored.
        type: string
    type: object
  handler.UpdateTargetRequest:
    properties:
      name:
        type: string
      schedule:
        type: string
    type: object
host: localhost:80
info:
  contact: {}
  description: Lightweight self-hosted uptime monitoring application API.
  title: Uptime Monitor API
  version: "1.0"
paths:
  /api/auth/verify:
    post:
      description: Checks whether the presented bearer token is valid. Returns 200
        when valid, 401 otherwise.
      responses:
        "200":
          description: Token is valid
        "401":
          description: Token is invalid
      security:
      - BearerAuth: []
      summary: Verify API token
      tags:
      - auth
  /api/target/{id}:
    put:
      consumes:
      - application/json
      description: Updates the name and schedule of an existing target.
      parameters:
      - description: Target ID
        in: path
        name: id
        required: true
        type: integer
      - description: Updated target fields (name and schedule only)
        in: body
        name: target
        required: true
        schema:
          $ref: '#/definitions/handler.UpdateTargetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: Updated target
          schema:
            $ref: '#/definitions/database.Target'
        "400":
          description: Invalid request
          schema:
            type: string
        "404":
          description: Target not found
          schema:
            type: string
        "500":
          description: Internal server error
          schema:
            type: string
      security:
      - BearerAuth: []
      summary: Update a target
      tags:
      - targets
  /api/targets:
    get:
      description: Returns all monitored targets along with their most recent health
        checks (up to 1500 per target).
      produces:
      - application/json
      responses:
        "200":
          description: List of targets with recent checks
          schema:
            items:
              $ref: '#/definitions/database.TargetWithChecks'
            type: array
        "500":
          description: Internal server error
          schema:
            type: string
      summary: List targets with recent checks
      tags:
      - targets
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
